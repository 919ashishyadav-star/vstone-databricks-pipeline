# "Data Chunking" job: splits the landing-volume source files into the four Bronze chunks.
# Runs the notebook src/notebooks/02_data_chunking.py on serverless compute.

resources:
  jobs:
    data_chunking:
      # The environment is in the name because dev and prod share one workspace (decision 9).
      name: "[${bundle.target}] Data Chunking"
      description: >-
        Splits the 122 Rain Forecast source CSVs (shared landing volume) into chunk1_csv,
        chunk2_csv (copied as-is), chunk3_json and chunk4_xml (converted, gzip) in this
        environment's Bronze raw_files volume, then checks row counts against the source.
        Safe to rerun.
      max_concurrent_runs: 1  # two runs must never write the same files at once
      timeout_seconds: 7200
      email_notifications:
        on_failure:
          - ${workspace.current_user.userName}

      # Job parameters are passed to the notebook widgets of the same name.
      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: landing_schema
          default: ${var.landing_schema}
        - name: landing_volume
          default: ${var.landing_volume}
        - name: bronze_schema
          default: ${var.bronze_schema}
        - name: raw_volume
          default: ${var.raw_volume}
        - name: config_path
          default: ${workspace.file_path}/src/config/chunk_plan.json
        - name: mode
          default: skip_existing

      tasks:
        - task_key: data_chunking
          # No cluster is defined, so the task runs on serverless compute.
          notebook_task:
            notebook_path: ../src/notebooks/02_data_chunking.py
          max_retries: 0
          # Serverless jobs otherwise retry failed tasks automatically.
          disable_auto_optimization: true
