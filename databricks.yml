# Databricks Asset Bundle definition for the VStone pipeline.
# The workspace host is NOT set here: it comes from your local Databricks CLI
# profile (~/.databrickscfg) or, in CI, from the DATABRICKS_HOST secret.
bundle:
  name: vstone-databricks-pipeline

# Jobs and pipelines are defined in their own files under resources/.
include:
  - resources/*.yml

# Names used by notebooks, jobs and pipelines. Code reads these through
# ${var.<name>} or job/notebook parameters instead of hard-coding them.
variables:
  catalog:
    description: Unity Catalog catalog that holds all pipeline schemas.
    default: workspace

  # Shared landing area: the original Kaggle CSVs are stored once here and
  # read by both dev and prod, so the ~20 GB dataset is not duplicated.
  landing_schema:
    description: Schema shared by all environments for original source files.
    default: vstone_landing
  landing_volume:
    description: Volume in the landing schema holding the original Kaggle CSVs.
    default: source_files

  # Per-environment medallion schemas (set in each target below).
  bronze_schema:
    description: Schema for this environment's Bronze tables and chunk files.
  silver_schema:
    description: Schema for this environment's Silver tables.
  gold_schema:
    description: Schema for this environment's Gold tables.
  raw_volume:
    description: Volume in the Bronze schema holding this environment's chunk outputs.
    default: raw_files

targets:
  dev:
    # Development mode prefixes deployed resources with [dev <user>] and
    # pauses job schedules, so experiments never clash with prod.
    mode: development
    default: true
    variables:
      bronze_schema: vstone_dev_bronze
      silver_schema: vstone_dev_silver
      gold_schema: vstone_dev_gold

  prod:
    # Production mode adds extra safety checks before deploy.
    mode: production
    workspace:
      # Deploy into the deploying user's folder (not /Workspace/Shared, which
      # every workspace user can write to). The user name is filled in at deploy time.
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    variables:
      bronze_schema: vstone_prod_bronze
      silver_schema: vstone_prod_silver
      gold_schema: vstone_prod_gold
