# CI for the Databricks Asset Bundle.
# For now this only VALIDATES the bundle (no deploy). Deploy steps will be
# added once the pipeline code exists and the team agrees on the release flow.
name: databricks-ci-cd

on:
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      # Credentials come only from GitHub Actions secrets, never from the repo.
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: databricks/setup-cli@main

      - name: Validate bundle (dev target)
        run: databricks bundle validate --target dev
